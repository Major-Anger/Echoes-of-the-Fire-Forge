modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# La bibliothèque commune : toujours requise
[[dependencies.${mod_id}]]
    modId="echoes_core"
    type="required"
    versionRange="${core_version_range}"
    ordering="AFTER"
    side="BOTH"

# Les autres épisodes : jamais requis. « optional » fait seulement charger la Forge après eux
# s'ils sont installés (et refuse une version trop ancienne).
[[dependencies.${mod_id}]]
    modId="echoes_silt"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
